# Role catalog used by setup_wizard.py — pick from lists instead of typing search terms.
#
# fields: what you studied / your background (first menu). Each field has groups of roles.
# A role:
#   en / he:     display names
#   keywords:    words in a JOB TITLE that mean this role (whole words, any language)
#   search:      search terms sent to the job boards (Hebrew + English)
#   skills:      typical skills — the wizard lets you tick the ones YOUR CV shows; the rest
#                count as "gaps" (requirements you don't have). "a|b" = b is an alias of a.
# Add roles or fields freely; the wizard reads this file every time.

fields:
  ee:
    en: "Electrical & Electronics Engineering"
    he: "הנדסת חשמל ואלקטרוניקה"
    sources: [goozali, hiremetech, alljobs, jobmaster, linkedin, defense, mobileye, amazon, workday]
    groups:
      - en: "Hardware & RF"
        he: "חומרה ו-RF"
        roles:
          - id: hardware
            en: "Hardware Engineer"
            he: "מהנדס/ת חומרה"
            keywords: [hardware, hw, electronics, electronic, חומרה, אלקטרוניקה]
            search: [hardware engineer, electronics engineer, מהנדס חומרה, מהנדס אלקטרוניקה]
            skills: ["schematics|circuit design|סכמות", "analog|אנלוגי", digital design, "oscilloscope|lab equipment|מעבדה", "bring-up|bring up", pcb, matlab, python]
          - id: board
            en: "Board Design Engineer"
            he: "מהנדס/ת תכן כרטיסים"
            keywords: [board design, board designer, pcb, layout, תכן כרטיסים]
            search: [board design engineer, תכן כרטיסים]
            skills: ["orcad|allegro|altium", "si/pi|signal integrity|power integrity", "high-speed|ddr|pcie", schematics, "power supply|dc-dc"]
          - id: rf
            en: "RF / Antenna Engineer"
