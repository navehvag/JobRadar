  max_age_days: 30           # skip jobs posted more than N days ago (sources that give a date)

  # Source fields that are never relevant (Goozali's "Field" values etc.)
  exclude_fields:
    - "IT and System Administration"
    - "DevOps"
    - "Cybersecurity"
    - "Data Science, ML & Algorithms"
    - "Data Analytics & BI"
    - "Data Analyst"
    - "Data Engineering"
    - "Frontend Development"
    - "Mobile Development"
    - "Product Management"
    - "UI/UX, Design & Content"
    - "Finance"
    - "Sales"
    - "Marketing"
    - "Business Development"
    - "Customer Success"
    - "HR & Recruitment"
    - "Compliance, Legal & Policy"
    - "Operations"
    - "C-Level"
    - "Natural Science"

