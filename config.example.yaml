        - "customer engineer"
        - "field engineer"
        - "מהנדס מכירות"
        - "מהנדס/ת מכירות"
        - "מהנדס אפליקציה"
        - "מהנדס/ת אפליקציה"

    # matches the "Project management" CV folder
