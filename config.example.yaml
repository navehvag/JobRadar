  bot_token_env: "TELEGRAM_BOT_TOKEN"
  chat_id_env: "TELEGRAM_CHAT_ID"       # default chat — everything goes here unless routed below
  # Option A: one group with Topics — category -> topic id (from `py telegram_notifier.py --setup`)
  topics:
    "Embedded & Firmware": 0
    "Validation & Verification": 0
    "Hardware & Electrical": 0
    "Integration & System": 0
  # Option B: separate chat per category — category -> env var with that chat id
  chats: {}

# ------------------------------------------------------------------ CV match score
# How much of what a job asks for does the CV cover?  (see matcher.py)
#   fit = have / (have + gaps), x evidence, x experience penalty, +10% for junior wording
# "skills" = what YOUR CV actually shows. "gaps" = common requirements your CV does NOT show.
# The values below are an EXAMPLE (an electrical-engineering graduate) — replace them with yours,
# or let `python setup_wizard.py` build them from the keywords you enter.
# If you really know a "gap" skill, add it to your CV and move it to "skills".
profile:
  experience_years: 1.5      # your years of industry experience
  penalty_per_year: 0.22     # score drops 22% per required year beyond experience_years + 0.5
  min_evidence: 10           # minimum matched weight for a full score
  highlight_score: 60        # ⭐ in alerts at or above this score
  apply_score: 60            # jobs at or above this go to apply_queue.json for review

  skills:
    # RF / analog
    "rf": {weight: 4, aliases: ["radio frequency", "microwave", "rf design", "מיקרוגל"]}
    "antenna": {weight: 3, aliases: ["antennas", "אנטנה", "אנטנות"]}
    "analog": {weight: 4, aliases: ["analogue", "analog design", "mixed signal", "mixed-signal", "אנלוגי", "אנלוגיים"]}
    "ads/cst": {weight: 2, aliases: ["ads", "cst", "hfss", "keysight ads"]}
    # digital design
    "systemverilog": {weight: 4, aliases: ["system verilog", "verilog", "rtl"]}
    "digital design": {weight: 3, aliases: ["logic design", "digital logic", "תכן לוגי"]}
    "risc-v": {weight: 3, aliases: ["riscv", "processor design", "cpu design"]}
    "fpga": {weight: 3, aliases: ["vivado", "xilinx"]}
    # integration / validation
    "system integration": {weight: 4, aliases: ["hw/sw integration", "e2e integration", "integration engineer", "integrator", "שילובים"]}
    "integration": {weight: 1, aliases: ["אינטגרציה"]}
    "validation": {weight: 3, aliases: ["system validation", "hardware validation", "v&v", "ולידציה"]}
    "verification": {weight: 1, aliases: ["וריפיקציה"]}
    "test automation": {weight: 3, aliases: ["automation", "automated testing", "test scripts", "test setups", "אוטומציה"]}
    "servers": {weight: 2, aliases: ["server", "rack", "data center", "datacenter", "deployment"]}
    # hands-on hardware
    "bring-up": {weight: 3, aliases: ["bring up", "bringup", "board bring-up"]}
    "lab": {weight: 3, aliases: ["oscilloscope", "oscilloscopes", "spectrum analyzer", "lab equipment", "lab tools", "scopes", "מעבדה"]}
    "schematics": {weight: 3, aliases: ["schematic", "circuit analysis", "circuit design", "סכמות", "סכמה"]}
    "troubleshooting": {weight: 2, aliases: ["debugging", "debug", "board-level", "תקלות"]}
    "kicad/multisim": {weight: 1, aliases: ["kicad", "multisim"]}
    # general
    "communication systems": {weight: 2, aliases: ["communications", "communication", "wireless", "תקשורת"]}
    "python": {weight: 2, aliases: ["scripting"]}
    "c/c++": {weight: 1, aliases: ["c++", "embedded c"]}
    "matlab": {weight: 1, aliases: ["simulink"]}
    "hardware": {weight: 1, aliases: ["hw", "electronics", "חומרה", "אלקטרוניקה"]}
    "b.sc ee": {weight: 2, aliases: ["electrical engineering", "electronics engineering", "electrical and electronics", "הנדסת חשמל", "הנדסת אלקטרוניקה"]}

