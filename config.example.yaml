# ------------------------------------------------------------------ sources
# Turn any source on/off with `enabled`. A source that fails is logged and skipped.
source_timeout_seconds: 420  # a source that takes longer is skipped for this run
scan_jitter_minutes: 8       # cron scans start 0–8 min after the hour (not when run by hand)

sources:
  goozali: true

  hiremetech:
    enabled: true
    posted_days: 30        # only jobs posted in the last N days (HireMe's q= matches TITLES only)
    max_pages: 3           # x100 results per query
    queries:
      - "hardware"
      - "electronics"
      - "electrical"
      - "embedded"
      - "firmware"
      - "fpga"
      - "asic"
      - "rf"
      - "validation"
      - "verification"
      - "integration"
      - "system engineer"
      - "חומרה"
      - "אלקטרוניקה"
      - "אינטגרציה"
      - "hardware engineer"
      - "electrical engineer"
      - "test engineer"
      - "analog"
      - "board"
      - "lab"
      - "bring-up"
      - "integrator"
      - "silicon"
      - "חשמל"
      - "בדיקות"

  rafael: false            # site has anti-bot protection; Rafael jobs still arrive via LinkedIn/Goozali
  iai: true                # includes Elta
  elbit: true
  mobileye: true

  # Israeli boards (HTML search pages, parsed in israeli_boards.py). Hebrew queries work best.
  # AllJobs: 30 jobs/page with full description. JobMaster: 10 jobs/page, full text fetched
  # only for jobs that pass the filter.
  alljobs:
    enabled: true
    max_pages: 2
    queries: &israeli_queries
      - "מהנדס חומרה"
      - "מהנדס אלקטרוניקה"
      - "מהנדס חשמל"
      - "מהנדס מערכת"
      - "אינטגרציה"
      - "מהנדס בדיקות"
      - "מהנדס RF"
      - "אנטנות"
      - "תכן כרטיסים"
      - "embedded"
      - "קושחה"
      - "FPGA"
      - "VLSI"
      - "מהנדס מכירות"
      - "מהנדס אפליקציה"
      - "מנהל פרויקטים הנדסי"
      - "hardware engineer"
      - "electronics engineer"
  jobmaster:
    enabled: true
    max_pages: 1             # guests only get page 1 (page 2+ needs login)
    queries: *israeli_queries

  # Amazon jobs in Israel (incl. Annapurna Labs chip design) — amazon.jobs public JSON
  amazon: true

  indeed:
    enabled: true          # needs: pip install python-jobspy
    sites: ["indeed"]
    hours_old: 72
    results_per_term: 50
    search_terms:
      - "hardware engineer"
      - "electronics engineer"
      - "embedded engineer"
      - "firmware engineer"
      - "validation engineer"
      - "integration engineer"
      - "system engineer"
      - "FPGA engineer"

  # LinkedIn public job search via python-jobspy (no login). Descriptions are fetched so jobs
  # can be scored against the CV — slower, so fewer results per term. Duplicates of jobs already
  # sent from Goozali etc. are dropped by company+title.
  linkedin:
    enabled: true
    run_hours: [9, 15]      # only on the 9:00 and 15:00 scans (hours_old 72 still covers every job)
    hours_old: 72
    results_per_term: 25
    search_terms:
      - "hardware engineer"
      - "electrical engineer"
      - "electronics engineer"
      - "integration engineer"
      - "validation engineer"
      - "system engineer hardware"
      - "embedded engineer"
      - "FPGA engineer"
      - "test engineer electronics"

  # Big companies on Workday — scraped directly (Israel jobs only where the site allows)
  workday:
    - name: "NVIDIA"
      url: "https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite"
    - name: "Intel"
      url: "https://intel.wd1.myworkdayjobs.com/External"
    - name: "Applied Materials"
      url: "https://amat.wd1.myworkdayjobs.com/External"
    - name: "Marvell"
      url: "https://marvell.wd1.myworkdayjobs.com/MarvellCareers"
      max_pages: 20
    - name: "KLA"
      url: "https://kla.wd1.myworkdayjobs.com/Search"
      max_pages: 60
    - name: "Broadcom"
      url: "https://broadcom.wd1.myworkdayjobs.com/External_Career"
      max_pages: 20
    - name: "NXP"                      # Yokneam (MCU / SoC design)
      url: "https://nxp.wd3.myworkdayjobs.com/careers"
      max_pages: 20
    - name: "GE HealthCare"            # Haifa / Rehovot
      url: "https://gehc.wd5.myworkdayjobs.com/GEHC_ExternalSite"
      max_pages: 20
    - name: "Motorola Solutions"       # Tel Aviv / Ra'anana
      url: "https://motorolasolutions.wd5.myworkdayjobs.com/Careers"
      max_pages: 20
    - name: "HP Indigo"                # Ness Ziona / Kiryat Gat
      url: "https://hp.wd5.myworkdayjobs.com/ExternalCareerSite"
      max_pages: 20
    - name: "Philips"                  # Haifa (imaging HW / FPGA / board design)
      url: "https://philips.wd3.myworkdayjobs.com/jobs-and-careers"
      max_pages: 20

